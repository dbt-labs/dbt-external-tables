[tox]
skipsdist = True
envlist = dbt_integration_{redshift,snowflake,bigquery}

[testenv]
skip_install = true
allowlist_externals = bash
passenv =
    DBT_TEST_BIN
    DBT_TEST_THREADS
    DBT_PROFILES_DIR
    # redshift
    REDSHIFT_HOST
    REDSHIFT_USER
    DBT_ENV_SECRET_REDSHIFT_PASS
    REDSHIFT_DATABASE
    REDSHIFT_SCHEMA
    REDSHIFT_PORT
    REDSHIFT_SPECTRUM_IAM_ROLE
    # snowflake
    SNOWFLAKE_ACCOUNT
    SNOWFLAKE_USER
    DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY
    DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE
    SNOWFLAKE_ROLE
    SNOWFLAKE_DATABASE
    SNOWFLAKE_WAREHOUSE
    SNOWFLAKE_SCHEMA
    # bigquery
    BIGQUERY_KEYFILE_JSON
    BIGQUERY_PROJECT
    BIGQUERY_SCHEMA

[testenv:dbt_integration_redshift]
commands =
    bash {toxinidir}/run_test.sh redshift

[testenv:dbt_integration_snowflake]
commands =
    bash {toxinidir}/run_test.sh snowflake

[testenv:dbt_integration_bigquery]
commands =
    bash {toxinidir}/run_test.sh bigquery
